</head>
<body><header class="appbar"><div class="brand"><span class="brand-icon" aria-hidden="true">◩</span><strong>爱学习的橘子猫</strong></div><nav class="page-tabs" aria-label="工作区" role="tablist"><button id="tab-edit" role="tab" aria-controls="edit-page" aria-selected="true" type="button">封面工作台</button><button id="tab-library" role="tab" aria-controls="library-page" aria-selected="false" tabindex="-1" type="button">素材库</button></nav><div class="project-name" id="project-name"></div><div class="app-actions"><span id="save-state" role="status">正在打开</span><button id="backup" hidden>备份冲突草稿</button><button id="review" class="primary" disabled>确认封面</button></div></header>
<main class="workspace" id="edit-page" role="tabpanel" aria-labelledby="tab-edit"><aside class="layers panel"><div class="panel-title"><h2>图层</h2><span id="layer-count"></span></div>
<div id="layers" title="长按图层可拖动排序"></div><div class="add-row"><button id="new-text">＋ 文字</button><button id="new-image">＋ 截图</button><button id="new-sticker">＋ 贴纸</button><button id="new-character" hidden>＋ 人物</button></div>
<div class="layer-footer"><button id="raise">上移一层</button><button id="lower">下移一层</button></div></aside>
<section class="studio"><div class="studio-bar"><div class="formats" aria-label="画幅"><button data-format="portrait">3:4</button><button data-format="main">4:3</button><button data-format="wide">16:9</button><button data-format="wechat" title="公众号主封面">2.35:1</button></div><div class="history"><button id="undo" title="撤销 Ctrl+Z" aria-label="撤销">↶</button><button id="redo" title="重做 Ctrl+Shift+Z" aria-label="重做">↷</button></div></div>
<div class="stage" id="stage"><div id="paper"><canvas id="canvas" aria-label="可拖动的封面画布" tabindex="0"></canvas><div id="selection" hidden><i></i><i></i><i></i><button id="resize" title="拖动缩放" aria-label="拖动缩放"></button></div></div></div>
<footer class="stage-foot"><span id="dimensions"></span><span id="zoom"></span></footer></section>
<aside class="inspector panel"><div class="panel-title"><h2>图层属性</h2></div><section id="portrait-welcome" class="portrait-welcome" aria-labelledby="welcome-title" hidden>
  <h3 id="welcome-title">添加你的 IP 人物</h3><p>可以在聊天里发来人物图，或在这里选图，存入人物库供下次使用。</p>
  <label class="welcome-pick">选择人物图片<input id="welcome-file" type="file" accept="image/png,image/jpeg,image/webp"></label>
  <button type="button" id="welcome-skip">稍后添加</button><p id="welcome-status" role="status" hidden></p>
</section><section id="shot-welcome" class="portrait-welcome" aria-labelledby="shot-title" hidden>
  <h3 id="shot-title">添加真实截图</h3><p>在聊天里发来视频或截图，也可以直接选图。四种画幅会自动排好。</p>
  <button type="button" id="shot-pick">选择截图</button><button type="button" id="shot-skip">暂时跳过</button>
</section><div id="properties"></div></aside></main>
<input id="upload" type="file" accept="image/png,image/jpeg,image/webp" hidden>
<dialog id="cutout-dialog" aria-labelledby="cutout-title">
  <header><h2 id="cutout-title">人物抠图</h2><button type="button" id="cutout-close" aria-label="关闭抠图预览">×</button></header>
  <div class="cutout-toolbar"><div role="group" aria-label="对比人物图片"><button id="cutout-before" aria-pressed="true">原图</button><button id="cutout-after" aria-pressed="false" disabled>透明底</button></div><button id="cutout-zoom" aria-pressed="false">查看原尺寸</button></div>
  <div id="cutout-view"><img id="cutout-image" alt="人物原图"></div>
  <p id="cutout-status" role="status"></p>
  <footer><button id="cutout-cancel">保留原图</button><button id="cutout-setup" hidden>安装本机抠图组件</button><button class="primary" id="cutout-apply" disabled>使用透明底</button></footer>
</dialog>
<section id="library-page" role="tabpanel" aria-labelledby="tab-library" hidden>
  <aside class="catalog-sidebar"><h2>素材分类</h2><nav id="categories" aria-label="素材分类"></nav></aside>
  <section class="catalog-main">
    <header class="catalog-head"><div><h1 id="catalog-title">IP 人物</h1><p id="catalog-summary"></p></div><div class="catalog-add"><button id="import-assets" class="import-button">＋ 添加素材</button></div></header>
    <input id="asset-files" type="file" multiple hidden>
    <div id="catalog-grid" aria-label="分类素材"></div><p id="catalog-empty" hidden></p>
    <div id="asset-menu" role="menu" aria-label="素材操作" hidden><button id="earlier" role="menuitem">向前移</button><button id="later" role="menuitem">向后移</button><button id="rename-asset" role="menuitem">改名</button><button id="remove-asset" role="menuitem">删除</button></div>
    <details id="restore-assets" hidden><summary>已移除的内置素材</summary><div id="restore-items"></div></details>
    <p id="catalog-status" role="status" aria-live="polite"></p>
  </section>
</section>
<dialog id="item-dialog"><form id="item-form"><h2 id="item-title"></h2><p id="item-message"></p><div id="item-preview" hidden></div><label class="field" id="item-name-field">素材名称<input id="item-name" maxlength="80" autocomplete="off"></label><footer><button type="button" id="cancel-item">取消</button><button id="accept-item" class="import-button" type="submit">确定</button></footer></form></dialog>
<dialog id="review-dialog" aria-labelledby="review-title">
  <form method="dialog"><button class="close-dialog" aria-label="关闭">×</button></form>
  <h2 id="review-title">确认封面</h2>
  <section id="review-options"><p>勾选这次需要的封面比例</p>
    <fieldset id="format-options" aria-label="成品比例"></fieldset>
    <p class="destination">成品位置<span id="output-dir"></span></p>
    <button class="confirm-primary" id="approve-formats">确认所选比例</button>
  </section>
  <section id="review-done" hidden><p id="approved-formats"></p>
    <p>回到对话，告诉 AI <strong>「封面 OK」</strong>，就会生成选中的封面。</p>
    <p class="destination">成品位置<span id="confirmed-output"></span></p>
    <form method="dialog"><button class="confirm-primary">知道了</button></form>
  </section>
  <p id="review-error" role="alert"></p>
</dialog>
<div id="feedback" role="status" hidden></div>
<script type="module" src="/editor.js"></script></body></html>
